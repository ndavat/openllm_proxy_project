version: "3.9"

services:
  openllm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openllm-mistral
    ports:
      - "3000:3000"
    environment:
      - MODEL_ID=mistralai/mistral-7b-instruct-v0.2
      - OPENLLM_MODEL_NAME=mistralai/mistral-7b-instruct-v0.2
      - OPENLLM_BACKEND=pt
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    volumes:
      - ./models:/root/.cache/huggingface
    restart: unless-stopped

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: openllm-proxy
    ports:
      - "8080:8080"
    environment:
      - TARGET_API=http://openllm:3000
      - API_KEY=local-key-123
    depends_on:
      - openllm
    restart: unless-stopped

networks:
  default:
    driver: bridge
